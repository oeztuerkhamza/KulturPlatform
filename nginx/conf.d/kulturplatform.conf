# ─── HTTP → HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name kulturplattformfreiburg.org www.kulturplattformfreiburg.org
                api.kulturplattformfreiburg.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend (kulturplattformfreiburg.org) ───────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name kulturplattformfreiburg.org www.kulturplattformfreiburg.org;

    ssl_certificate     /etc/letsencrypt/live/kulturplattformfreiburg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kulturplattformfreiburg.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    # The public frontend may be embedded as a live demo on the portfolio
    # (hamzaoeztuerk.de). X-Frame-Options cannot whitelist a third-party origin
    # (ALLOW-FROM is dead), so framing is governed by CSP frame-ancestors —
    # which permits only self + the portfolio + localhost.
    add_header Content-Security-Policy "frame-ancestors 'self' https://hamzaoeztuerk.de http://localhost:4200 http://localhost:4000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets – long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── API (api.kulturplattformfreiburg.org) ────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.kulturplattformfreiburg.org;

    ssl_certificate     /etc/letsencrypt/live/kulturplattformfreiburg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kulturplattformfreiburg.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Increase buffer for large file uploads
    client_max_body_size 20M;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
