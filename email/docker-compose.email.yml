version: '3.8'

services:
  # ─── Mail Server (Postfix + Dovecot) ────────────────────────────────────────
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: kpf_mailserver
    hostname: mail.kulturplattformfreiburg.org
    domainname: kulturplattformfreiburg.org
    restart: unless-stopped
    ports:
      - "25:25"       # SMTP  (incoming mail)
      - "465:465"     # SMTPS (submission over TLS)
      - "587:587"     # SMTP  (submission STARTTLS)
      - "993:993"     # IMAPS (mail clients)
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config/:/tmp/docker-mailserver/
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      # ── Genel Ayarlar ──
      - OVERRIDE_HOSTNAME=mail.kulturplattformfreiburg.org
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=1
      - SPAMASSASSIN_SPAM_TO_INBOX=1
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ENABLE_SASLAUTHD=0
      - ONE_DIR=1
      - TZ=Europe/Berlin
      # ── SSL ──
      - SSL_TYPE=letsencrypt
      - SSL_DOMAIN=kulturplattformfreiburg.org
      # ── DKIM ──
      - ENABLE_OPENDKIM=1
      # ── Postfix ──
      - POSTFIX_MESSAGE_SIZE_LIMIT=26214400
      # ── Dovecot ──
      - DOVECOT_MAILBOX_FORMAT=maildir
    cap_add:
      - NET_ADMIN
    networks:
      - kpf_network
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':25' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Roundcube Webmail ──────────────────────────────────────────────────────
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: kpf_roundcube
    restart: unless-stopped
    depends_on:
      - mailserver
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
    volumes:
      - roundcube_data:/var/roundcube/db
      - roundcube_html:/var/www/html
    networks:
      - kpf_network

volumes:
  maildata:
  mailstate:
  maillogs:
  roundcube_data:
  roundcube_html:
  certbot_certs:
    external: true
    name: kulturplatform_certbot_certs

networks:
  kpf_network:
    external: true
    name: kulturplatform_kpf_network
